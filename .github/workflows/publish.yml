# Publish the live site to https://cade30008.github.io.
#
# Builds only what publish.yaml lists (scripts/build_live.py), fails if any link
# in the result is broken, and deploys it to GitHub Pages. Runs on every push to
# main, or by hand from the Actions tab.
#
# One-time set-up, in the repository's Settings > Pages: set "Source" to
# "GitHub Actions".
#
# Slides are built here. docs/slides/ is git ignored, so without this step the
# deployed site has no decks and every handout's Slides link is a 404. That is
# what happened the morning week 1 was published.
#
# The decks are built as HTML and PDF. Every handout links to both, so leaving
# the PDF out gives a published page a dead link.
#
# Handout PDFs, in docs/downloads/, are still not built: nothing published
# links to them. Add a step here if that changes.

name: Publish the live site

on:
  push:
    branches: [main]
  workflow_dispatch:

# Scoped per job, not workflow-wide: the build job only ever reads, and a job
# that cannot deploy cannot deploy by accident. Only one workflow in this
# repository may write to Pages - two racing for one deployment presents as a
# flaky deploy rather than an obvious error.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # theme/ is the Flight Lab Zensical theme; without it the site
          # builds unbranded, and zensical fails on the missing custom_dir.
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: pip install -r requirements.txt
      - name: Build the decks, HTML and PDF
        run: npm run slides
      - name: Build the live site and check its links
        run: python scripts/build_live.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .live/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
