<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Trebuchet MS, Arial, sans-serif" role="img" aria-labelledby="t d"><title id="t">Your week: 6 hours</title><desc id="d">A week with a lecture is 2 hours of lecture, 2 of independent learning and 2 of coursework, 6 in total. The independent hours are 0.75 h handout and the week's challenge, 1 h example sheet, 0.25 h next week's case. Consolidation week replaces the lecture and independent hours with 4 hours of recommended activities. On top of all of it, 4 hours in the Quanser laboratory, at times you choose.</desc>
<rect width="1000" height="380" fill="#fff"/>
<text x="150" y="30" font-size="17" font-weight="700" fill="#1a1a1a">Your week, every week from 1 to 11</text>
