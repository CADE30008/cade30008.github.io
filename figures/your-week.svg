<text x="134" y="90.0" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="end">A lecture week</text>
<text x="134" y="108.0" font-size="12.5" fill="#5a5a5a" text-anchor="end">6 hours</text>
<rect x="150.0" y="62" width="253.3" height="54" fill="#b01c2e" stroke="#b01c2e" stroke-width="1.4"/>
