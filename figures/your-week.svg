<text x="530.0" y="102" font-size="12.5" fill="#1a1a1a" text-anchor="middle">On your own</text>
<rect x="656.7" y="62" width="253.3" height="54" fill="#fff" stroke="#b01c2e" stroke-width="1.4"/>
<text x="783.3" y="84" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2 h</text>
<text x="783.3" y="102" font-size="12.5" fill="#1a1a1a" text-anchor="middle">Coursework</text>
<path d="M 403.3 116 L 150 150 M 656.7 116 L 910 150" stroke="#bfbfbf" stroke-width="1.2" fill="none"/>
<text x="134" y="176" font-size="13.5" fill="#5a5a5a" text-anchor="end">which is</text>
<rect x="150.0" y="150" width="285.0" height="44" fill="#f6e3e5" stroke="#b01c2e" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="292.5" y="169" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">45 min</text>
<text x="292.5" y="185" font-size="11.5" fill="#5a5a5a" text-anchor="middle">Handout and the week&#x27;s challenge</text>
<rect x="435.0" y="150" width="380.0" height="44" fill="#f6e3e5" stroke="#b01c2e" stroke-width="1.1" stroke-dasharray="4 3"/>
<text x="625.0" y="169" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">60 min</text>
<text x="625.0" y="185" font-size="11.5" fill="#5a5a5a" text-anchor="middle">Example sheet</text>
