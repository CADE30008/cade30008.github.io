<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 230" font-family="Trebuchet MS, Fira Sans, Helvetica, Arial, sans-serif" font-size="17">
  <title>A mass on a spring and a damper, driven by a force F, with displacement z measured from the unforced position</title>
  <style>
    .v   { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", Georgia, "Times New Roman", serif; font-style: italic; font-size: 19px; }
    .lbl { font-size: 13px; fill: #555; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1D1B"/>
    </marker>
  </defs>
  <rect width="560" height="230" fill="#ffffff"/>

  <!-- the wall, hatched on the side the room is not on -->
  <g stroke="#1D1D1B" stroke-width="1.8" fill="none">
    <line x1="56" y1="36" x2="56" y2="196"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.3">
    <line x1="56" y1="44" x2="40" y2="60"/>
    <line x1="56" y1="68" x2="40" y2="84"/>
    <line x1="56" y1="92" x2="40" y2="108"/>
    <line x1="56" y1="116" x2="40" y2="132"/>
    <line x1="56" y1="140" x2="40" y2="156"/>
    <line x1="56" y1="164" x2="40" y2="180"/>
    <line x1="56" y1="188" x2="40" y2="204"/>
  </g>

  <g stroke="#1D1D1B" stroke-width="1.8" fill="none">
    <!-- spring -->
    <polyline points="56,78 104,78 116,62 140,94 164,62 188,94 212,62 236,94 248,78 300,78"/>
    <!-- damper: body on the wall side, piston on the mass side -->
    <line x1="56" y1="152" x2="148" y2="152"/>
    <rect x="148" y="128" width="72" height="48"/>
    <line x1="196" y1="132" x2="196" y2="172" stroke-width="4"/>
    <line x1="196" y1="152" x2="300" y2="152"/>
    <!-- the mass -->
    <rect x="300" y="48" width="112" height="134" rx="3" stroke="#B01C2E" stroke-width="2.2"/>
    <!-- the applied force -->
    <line x1="412" y1="115" x2="498" y2="115" marker-end="url(#arrow)"/>
    <!-- displacement, measured from where the mass sits with no force on it -->
    <line x1="356" y1="30" x2="430" y2="30" marker-end="url(#arrow)"/>
  </g>
  <g stroke="#8a8a8a" stroke-width="1.3" stroke-dasharray="4 4" fill="none">
    <line x1="356" y1="18" x2="356" y2="48"/>
  </g>

  <g fill="#1D1D1B">
    <text class="v" x="348" y="124">m</text>
    <text class="v" x="504" y="121">F</text>
    <text class="v" x="386" y="24">z</text>
    <text class="v" x="160" y="62">k</text>
    <text class="v" x="160" y="202">c</text>
  </g>
</svg>
