<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 210" font-family="Trebuchet MS, Fira Sans, Helvetica, Arial, sans-serif" font-size="17">
  <title>Single-input, single-output loop: R(s) into a summing junction, through C(s) and G(s) to Y(s), fed back through H(s)</title>
  <style>
    /* Set as the handout sets them: a variable italic in the maths serif, a
       subscript that names something upright, labels in the sans face. See
       "Numbers, figures and code" in AGENTS.md. */
    .v   { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", Georgia, "Times New Roman", serif; font-style: italic; }
    .d   { font-style: normal; font-size: 16px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1D1B"/>
    </marker>
  </defs>
  <rect width="660" height="210" fill="#ffffff"/>
  <g stroke="#1D1D1B" stroke-width="1.8" fill="none">
    <!-- reference into the summing junction -->
    <line x1="18" y1="62" x2="104" y2="62" marker-end="url(#arrow)"/>
    <circle cx="120" cy="62" r="15"/>
    <!-- error into the controller -->
    <line x1="135" y1="62" x2="208" y2="62" marker-end="url(#arrow)"/>
    <rect x="210" y="34" width="110" height="56" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <!-- controller output into the plant -->
    <line x1="320" y1="62" x2="368" y2="62" marker-end="url(#arrow)"/>
    <rect x="370" y="34" width="110" height="56" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <!-- plant output, and the tap that feeds the measurement back -->
    <line x1="480" y1="62" x2="636" y2="62" marker-end="url(#arrow)"/>
    <polyline points="568,62 568,152 418,152" marker-end="url(#arrow)"/>
    <rect x="288" y="124" width="110" height="56" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <polyline points="288,152 120,152 120,92" marker-end="url(#arrow)"/>
  </g>
  <!-- the junction's cross, on the diagonals so it reads as a symbol rather
       than a continuation of the signals entering it -->
  <g stroke="#1D1D1B" stroke-width="1.3" fill="none">
    <line x1="110" y1="52" x2="130" y2="72"/>
    <line x1="110" y1="72" x2="130" y2="52"/>
  </g>
  <g fill="#1D1D1B">
    <text class="v" x="22" y="50">R(s)</text>
    <text class="v" x="240" y="69">C(s)</text>
    <text class="v" x="400" y="69">G(s)</text>
    <text class="v" x="318" y="159">H(s)</text>
    <text class="v" x="588" y="50">Y(s)</text>
    <text class="d" x="100" y="51">+</text>
    <text class="d" x="100" y="83">&#8722;</text>
  </g>
</svg>
