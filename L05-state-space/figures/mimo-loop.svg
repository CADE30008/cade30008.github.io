<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" font-family="Trebuchet MS, Fira Sans, Helvetica, Arial, sans-serif" font-size="17">
  <title>Two inputs and two outputs, cross-coupled through G2 and G4 and fed back through H1</title>
  <style>
    .v   { font-family: "Latin Modern Math", "STIX Two Math", "Cambria Math", Georgia, "Times New Roman", serif; font-style: italic; }
    .sub { font-size: 12px; }
    .d   { font-style: normal; font-size: 16px; font-weight: 700; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1D1D1B"/>
    </marker>
  </defs>
  <rect width="720" height="430" fill="#ffffff"/>

  <g stroke="#1D1D1B" stroke-width="1.8" fill="none">
    <!-- top path: U1 through G1, across to the junction, out through G5 -->
    <line x1="34" y1="60" x2="94" y2="60" marker-end="url(#arrow)"/>
    <rect x="96" y="34" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <line x1="182" y1="60" x2="453" y2="60" marker-end="url(#arrow)"/>
    <circle cx="470" cy="60" r="15"/>
    <line x1="485" y1="60" x2="518" y2="60" marker-end="url(#arrow)"/>
    <rect x="520" y="34" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <line x1="606" y1="60" x2="646" y2="60" marker-end="url(#arrow)"/>

    <!-- the cross term down from G1's output, through G2, into the lower junction -->
    <polyline points="236,60 236,136" marker-end="url(#arrow)"/>
    <rect x="193" y="138" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <polyline points="236,190 236,233" marker-end="url(#arrow)"/>

    <!-- bottom path: U2 through G3, the junction, G6, then G7 -->
    <line x1="34" y1="250" x2="94" y2="250" marker-end="url(#arrow)"/>
    <rect x="96" y="224" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <line x1="182" y1="250" x2="219" y2="250" marker-end="url(#arrow)"/>
    <circle cx="236" cy="250" r="15"/>
    <line x1="251" y1="250" x2="298" y2="250" marker-end="url(#arrow)"/>
    <rect x="300" y="224" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <line x1="386" y1="250" x2="538" y2="250" marker-end="url(#arrow)"/>
    <rect x="540" y="224" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <line x1="626" y1="250" x2="646" y2="250" marker-end="url(#arrow)"/>

    <!-- the cross term up from G6's output, through G4, into the upper junction -->
    <polyline points="470,250 470,192" marker-end="url(#arrow)"/>
    <rect x="427" y="138" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <polyline points="470,138 470,77" marker-end="url(#arrow)"/>

    <!-- the measurement, back through H1 into the lower junction -->
    <polyline points="470,250 470,352 393,352" marker-end="url(#arrow)"/>
    <rect x="305" y="326" width="86" height="52" rx="4" stroke="#B01C2E" stroke-width="2.2"/>
    <polyline points="305,352 236,352 236,267" marker-end="url(#arrow)"/>
  </g>

  <!-- junction crosses, and the taps that two paths leave from -->
  <g stroke="#1D1D1B" stroke-width="1.3" fill="none">
    <line x1="460" y1="50" x2="480" y2="70"/><line x1="460" y1="70" x2="480" y2="50"/>
    <line x1="226" y1="240" x2="246" y2="260"/><line x1="226" y1="260" x2="246" y2="240"/>
  </g>
  <g fill="#1D1D1B">
    <circle cx="236" cy="60" r="3.2"/>
    <circle cx="470" cy="250" r="3.2"/>

    <text class="v" x="12" y="48">U<tspan class="sub" dy="4">1</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="12" y="238">U<tspan class="sub" dy="4">2</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="654" y="66">Y<tspan class="sub" dy="4">1</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="654" y="256">Y<tspan class="sub" dy="4">2</tspan><tspan dy="-4">(s)</tspan></text>

    <text class="v" x="118" y="67">G<tspan class="sub" dy="4">1</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="215" y="171">G<tspan class="sub" dy="4">2</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="118" y="257">G<tspan class="sub" dy="4">3</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="449" y="171">G<tspan class="sub" dy="4">4</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="542" y="67">G<tspan class="sub" dy="4">5</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="322" y="257">G<tspan class="sub" dy="4">6</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="562" y="257">G<tspan class="sub" dy="4">7</tspan><tspan dy="-4">(s)</tspan></text>
    <text class="v" x="327" y="359">H<tspan class="sub" dy="4">1</tspan><tspan dy="-4">(s)</tspan></text>

    <text class="d" x="450" y="50">+</text>
    <text class="d" x="479" y="88">+</text>
    <text class="d" x="216" y="240">+</text>
    <text class="d" x="245" y="233">+</text>
    <text class="d" x="245" y="279">&#8722;</text>
  </g>
</svg>
