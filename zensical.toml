[project]
site_name = "CADE30008 Flight Dynamics & Control · in progress"
site_description = "Lectures, handouts and example sheets for CADE30008 Flight Dynamics & Control at the University of Bristol."
site_author = "Dr. Steve Bullock"
# The in-progress site. The live site, https://cade30008.github.io/, is built
# from a filtered copy by scripts/build_live.py; see publish.yaml.
site_url = "http://localhost:8000/"
# The footer is raw HTML and is NOT link-rewritten per page, so the About link
# must be root-relative. That assumes the site is served at the root of its
# domain, as site_url says; if it ever moves under a sub-path, put the prefix in
# here too.
copyright = """Teaching materials &copy; 2026 Dr Steve Bullock, University of Bristol, and licensed \
<a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>. \
Some elements excluded &mdash; see the <a href="/about/#licence">about page</a>."""

# The site follows the University calendar: "Week n" is week n of teaching
# block 1, and folders are wNN-topic. Weeks and titles come from
# curriculum/weeks.yaml, and scripts/build_curriculum.py checks that these
# entries match it. A lecture week is a collapsible section whose own link is
# the handout (navigation.indexes); the guest and consolidation weeks are
# single pages. Decks are built files, linked from the handout.
nav = [
  { "Home" = "index.md" },
  { "Week 1: The design cycle, end to end" = [
    { "Handout" = "w01-design-cycle/index.md" },
    { "Example sheet" = "w01-design-cycle/example-sheet.md" },
    { "Solutions" = "w01-design-cycle/solutions.md" },
  ] },
  { "Week 2: Requirements and models you can trust" = [
    { "Handout" = "w02-requirements-and-models/index.md" },
    { "Example sheet" = "w02-requirements-and-models/example-sheet.md" },
    { "Solutions" = "w02-requirements-and-models/solutions.md" },
  ] },
  { "Week 3: PID, properly" = [
    { "Handout" = "w03-pid-control/index.md" },
    { "Example sheet" = "w03-pid-control/example-sheet.md" },
    { "Solutions" = "w03-pid-control/solutions.md" },
  ] },
  { "Week 4: Stability and margins" = [
    { "Handout" = "w04-stability-margins/index.md" },
    { "Example sheet" = "w04-stability-margins/example-sheet.md" },
    { "Solutions" = "w04-stability-margins/solutions.md" },
  ] },
  { "Week 5: Guest lecture" = "w05-guest-lecture/index.md" },
  { "Week 6: Consolidation week" = "w06-consolidation/index.md" },
  { "Week 7: Robustness and trade-offs" = [
    { "Handout" = "w07-robustness/index.md" },
    { "Example sheet" = "w07-robustness/example-sheet.md" },
    { "Solutions" = "w07-robustness/solutions.md" },
  ] },
  { "Week 8: Loop shaping" = [
    { "Handout" = "w08-loop-shaping/index.md" },
    { "Example sheet" = "w08-loop-shaping/example-sheet.md" },
    { "Solutions" = "w08-loop-shaping/solutions.md" },
  ] },
  { "Week 9: Flight control architecture" = [
    { "Handout" = "w09-flight-control-architecture/index.md" },
    { "Example sheet" = "w09-flight-control-architecture/example-sheet.md" },
    { "Solutions" = "w09-flight-control-architecture/solutions.md" },
  ] },
  { "Week 10: State space and state feedback" = [
    { "Handout" = "w10-state-space/index.md" },
    { "Example sheet" = "w10-state-space/example-sheet.md" },
    { "Solutions" = "w10-state-space/solutions.md" },
  ] },
  { "Week 11: What comes next" = [
    { "Handout" = "w11-beyond-this-course/index.md" },
    { "Example sheet" = "w11-beyond-this-course/example-sheet.md" },
    { "Solutions" = "w11-beyond-this-course/solutions.md" },
  ] },
  { "Preparing for Control" = "preparing/index.md" },
  { "The textbook" = "reading.md" },
  { "Glossary" = "glossary.md" },
  { "About these materials" = "about.md" },
  { "AI in this course" = "ai.md" },
]

extra_css = ["stylesheets/flightlab.css", "stylesheets/course.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/py-runner.js",
  "javascripts/code-scroll.js",
  "javascripts/links.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
# The Flight Lab branding is a submodule, theme/, from
# BristolFlightLab/flightlab-zensical-theme, pinned to a tag. Everything in it
# is copied to the site root, so theme/stylesheets/flightlab.css and
# theme/assets/brand/ land beside the ones from docs/. A file in docs/ wins
# over the same path here, which is how a unit overrides one file without
# forking the theme: docs/assets/brand/ keeps only this unit's own mark.
#
# scripts/build_live.py rewrites this path for the filtered build, because
# custom_dir resolves against the config file's own directory.
custom_dir = "theme"
# The mark is a step response: rise, overshoot, settle onto the target. Two
# colourways of one drawing — red for the browser tab, white for the red header.
logo = "assets/brand/logo.svg"
favicon = "assets/brand/favicon.svg"
# navigation.sections is deliberately absent: it renders the top level as flat
# groups, which cannot be collapsed. Without it each lecture is a collapsible
# section, and navigation.indexes keeps the handout as the section's own page.
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
# Glossary abbreviations are appended to every page, so a term defined once in
# docs/includes/glossary-abbr.md gets a tooltip wherever it appears.
pymdownx.snippets.auto_append = ["includes/glossary-abbr.md"]
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
