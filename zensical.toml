[project]
site_name = "CADE30008 Flight Dynamics & Control"
site_description = "Lectures, handouts and example sheets for CADE30008 Flight Dynamics & Control at the University of Bristol."
site_author = "Dr. Steve Bullock"
site_url = "http://localhost:8000/"
# The footer is raw HTML and is NOT link-rewritten per page, so the About link
# must be root-relative. That assumes the site is served at the root of its
# domain, as site_url says; if it ever moves under a sub-path, put the prefix in
# here too.
copyright = """Teaching materials &copy; 2026 Dr Steve Bullock, University of Bristol, and licensed \
<a href="https://creativecommons.org/licenses/by/4.0/" rel="license">CC BY 4.0</a>. \
Some elements excluded &mdash; see the <a href="/about/#licence">about page</a>."""

# Lectures are numbered and ordered by curriculum/lectures.yaml; folders are
# lNN-topic, where NN is the lecture number, not a week number.
# scripts/build_curriculum.py checks that these entries match that file.
# Guest lectures are not numbered. Each lecture is a collapsible section
# whose own link is the handout (navigation.indexes), so the handout is not
# repeated as a child. Decks are built files, linked from the handout.
nav = [
  { "Home" = "index.md" },
  { "Lecture 1: The design cycle, end to end" = [
    { "Handout" = "l01-design-cycle/index.md" },
    { "Example sheet" = "l01-design-cycle/example-sheet.md" },
    { "Solutions" = "l01-design-cycle/solutions.md" },
  ] },
  { "Lecture 2: Requirements and models you can trust" = [
    { "Handout" = "l02-requirements-and-models/index.md" },
    { "Example sheet" = "l02-requirements-and-models/example-sheet.md" },
    { "Solutions" = "l02-requirements-and-models/solutions.md" },
  ] },
  { "Lecture 3: PID, properly" = [
    { "Handout" = "l03-pid-control/index.md" },
    { "Example sheet" = "l03-pid-control/example-sheet.md" },
    { "Solutions" = "l03-pid-control/solutions.md" },
  ] },
  { "Lecture 4: Stability and margins" = [
    { "Handout" = "l04-stability-margins/index.md" },
    { "Example sheet" = "l04-stability-margins/example-sheet.md" },
    { "Solutions" = "l04-stability-margins/solutions.md" },
  ] },
  { "Lecture 5: Robustness and trade-offs" = [
    { "Handout" = "l05-robustness/index.md" },
    { "Example sheet" = "l05-robustness/example-sheet.md" },
    { "Solutions" = "l05-robustness/solutions.md" },
  ] },
  { "Lecture 6: Loop shaping" = [
    { "Handout" = "l06-loop-shaping/index.md" },
    { "Example sheet" = "l06-loop-shaping/example-sheet.md" },
    { "Solutions" = "l06-loop-shaping/solutions.md" },
  ] },
  { "Lecture 7: Flight control architecture" = [
    { "Handout" = "l07-flight-control-architecture/index.md" },
    { "Example sheet" = "l07-flight-control-architecture/example-sheet.md" },
    { "Solutions" = "l07-flight-control-architecture/solutions.md" },
  ] },
  { "Lecture 8: State space and state feedback" = [
    { "Handout" = "l08-state-space/index.md" },
    { "Example sheet" = "l08-state-space/example-sheet.md" },
    { "Solutions" = "l08-state-space/solutions.md" },
  ] },
  { "Lecture 9: What comes next" = [
    { "Handout" = "l09-beyond-this-course/index.md" },
    { "Example sheet" = "l09-beyond-this-course/example-sheet.md" },
    { "Solutions" = "l09-beyond-this-course/solutions.md" },
  ] },
  { "Guest lecture" = "guest-lectures/index.md" },
  { "Preparing for Control" = "preparing/index.md" },
  { "Glossary" = "glossary.md" },
  { "About these materials" = "about.md" },
  { "AI in this course" = "ai.md" },
]

extra_css = ["stylesheets/flightlab.css", "stylesheets/course.css"]
extra_javascript = [
  "javascripts/mathjax.js",
  "javascripts/py-runner.js",
  "https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js",
]

[project.theme]
language = "en"
# The mark is a step response: rise, overshoot, settle onto the target. Two
# colourways of one drawing — red for the browser tab, white for the red header.
logo = "assets/brand/logo.svg"
favicon = "assets/brand/favicon.svg"
# navigation.sections is deliberately absent: it renders the top level as flat
# groups, which cannot be collapsed. Without it each lecture is a collapsible
# section, and navigation.indexes keeps the handout as the section's own page.
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.snippets.base_path = ["docs"]
pymdownx.snippets.check_paths = true
# Glossary abbreviations are appended to every page, so a term defined once in
# docs/includes/glossary-abbr.md gets a tooltip wherever it appears.
pymdownx.snippets.auto_append = ["includes/glossary-abbr.md"]
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
