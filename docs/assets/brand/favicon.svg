<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="A step response rising, overshooting, and settling onto its target">
  <title>CADE30008 Flight Dynamics &amp; Control</title>
  <!-- The target: what the system was asked to reach. -->
  <line x1="7" y1="21" x2="57" y2="21" stroke="#b01c2e" stroke-width="3"
        stroke-linecap="round" stroke-dasharray="0.1 7" opacity="0.5"/>
  <!-- The response: rise, overshoot, undershoot, settle. -->
  <path d="M7 53 L13 53 C18 53 19 8 27 11 C33 14 32 28 39 26 C45 24 45 20 51 21 L57 21"
        fill="none" stroke="#b01c2e" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
