<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two views of the same system</title>
<style>
  :root {
    --red: #B01C2E; --teal: #00A89E; --blue: #1f6f8b;
    --ink: #1D1D1B; --muted: #5f6462; --grid: #e3e6e5; --panel: #f6f7f7; --paper: #ffffff;
    font-family: "Trebuchet MS", "Fira Sans", Helvetica, Arial, sans-serif;
    font-size: clamp(11px, 1.15vw, 15px);
    color: var(--ink); background: var(--paper);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; }
  .app { flex: 1; display: grid; grid-template-rows: 1fr auto; gap: 0.4rem; padding: 0.6rem 0.7rem 0.5rem; min-height: 0; }

  /* Two columns, a hairline between them, exactly as the sketch has it: the
     same system twice, with the equivalence written on the rule itself. */
  .views { display: grid; grid-template-columns: 1fr 1px 1fr; gap: 0 0.9rem; min-height: 0; }
  .rule { background: var(--grid); position: relative; }
  .rule span {
    position: absolute; left: 50%; transform: translateX(-50%);
    background: var(--paper); padding: 0.25rem 0.15rem; color: var(--muted);
    font-size: 0.95rem; text-align: center; line-height: 1.25; white-space: nowrap;
  }
  .rule .equiv { top: 1.6rem; font-size: 1.5rem; color: var(--ink); }
  .rule .conv { bottom: 0.8rem; font-size: 0.78rem; }
  .rule .conv code { display: block; font-size: 0.8rem; color: var(--blue); }

  .view { display: grid; grid-template-rows: auto auto 1fr; min-height: 0; gap: 0.15rem; }
  .left { grid-template-rows: auto auto auto 1fr; }
  .view h2 { font-size: 0.95rem; margin: 0; color: var(--red); letter-spacing: 0.06em; text-transform: uppercase; }
  .stack { display: grid; min-height: 0; gap: 0.1rem; }
  .left .stack { grid-template-rows: 1.55fr 1.05fr 1.05fr 1.35fr; }
  .right .stack { grid-template-rows: auto auto 10rem; align-content: start; }
  /* The two pictures the state-space side has to itself: where the poles are,
     and where the state actually goes. */
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 0 0.7rem; min-height: 0; }

  figure { margin: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr; }
  figcaption { font-size: 0.76rem; color: var(--muted); }
  svg { width: 100%; height: 100%; display: block; overflow: hidden; }
  svg text { font-family: inherit; fill: var(--muted); font-size: 11px; }
  svg text.sig { fill: var(--ink); font-style: italic; font-size: 13px; }
  svg text.mat { fill: var(--ink); font-weight: 700; font-size: 15px; }

  /* The equations, under the right-hand diagram. Written as HTML rather than
     an image so they stay sharp at any size and can be read by a screen
     reader; the italic/upright split is ISO 80000-2, as everywhere else. */
  .eqns { font-size: 1.1rem; text-align: center; margin: 0.25rem 0 0.1rem; line-height: 1.75; }
  .eqns b { font-weight: 700; font-style: normal; }
  .eqns i { font-style: italic; }
  .eqns .faint { color: var(--muted); }
  .eqns.tf { font-size: 0.98rem; margin: 0.1rem 0 0.2rem; }
  .eqns.tf .vals { margin-left: 1.1rem; font-size: 0.92rem; color: var(--muted); }
  .eqns.tf .vals i, .eqns.tf .vals sub { color: var(--ink); }
  /* A fraction written as a stacked pair rather than a slash, so the quadratic
     reads as a denominator. */
  .frac { display: inline-grid; vertical-align: middle; text-align: center; line-height: 1.25; }
  .frac span:first-child { border-bottom: 1px solid currentColor; padding: 0 0.3rem; }
  .frac sub, .frac sup { font-style: normal; }

  .numbers { display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
             gap: 0.15rem 0.9rem; margin: 0.2rem 0 0.35rem; font-size: 0.92rem; }
  .numbers .matrix { display: inline-flex; align-items: center; }
  .numbers .rows { display: grid; row-gap: 0.05rem; text-align: center;
                   font-variant-numeric: tabular-nums; line-height: 1.15; }
  .numbers .bracket { font-size: 2.1em; line-height: 0.78; font-weight: 300; }
  .numbers .lbl { color: var(--muted); margin-left: -0.6rem; }
  .numbers .lbl b { color: var(--ink); }

  .controls { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center;
              gap: 0 0.8rem; background: var(--panel); border-radius: 6px; padding: 0.4rem 0.8rem; }
  .controls label { font-weight: 700; font-size: 0.92rem; white-space: nowrap; }
  .controls output { font-variant-numeric: tabular-nums; font-weight: 400; }
  input[type=range] { width: 100%; accent-color: var(--red); margin: 0; }
  button { font: inherit; font-size: 0.85rem; padding: 0.2rem 0.8rem; border: 1px solid var(--red);
           background: var(--paper); color: var(--red); border-radius: 999px; cursor: pointer; }
  button:hover, button:focus-visible { background: var(--red); color: #fff; }
  .readout { font-size: 0.88rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .readout b { color: var(--red); }
</style>
</head>
<body>
<main class="app">

  <div class="views">
    <!-- ------------------------------------------------ transfer function -->
    <section class="view left" aria-label="Transfer function">
      <h2>Transfer function</h2>

      <svg viewBox="0 0 420 54" role="img" aria-label="u into G, out to y">
        <defs>
          <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
            <path d="M0 0 L10 5 L0 10 z" fill="#1D1D1B"/>
          </marker>
        </defs>
        <line x1="40" y1="27" x2="168" y2="27" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <rect x="170" y="8" width="80" height="38" fill="none" stroke="#1D1D1B"/>
        <line x1="250" y1="27" x2="382" y2="27" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <text class="sig" x="14" y="31">u</text>
        <text class="sig" x="388" y="31">y</text>
        <text class="mat" x="196" y="33" font-style="italic">G</text>
      </svg>

      <p class="eqns tf">
        <i>G</i>(<i>s</i>) =
        <span class="frac"><span><i>K</i>&omega;<sub>n</sub><sup>2</sup></span><span><i>s</i><sup>2</sup> + 2&zeta;&omega;<sub>n</sub><i>s</i> + &omega;<sub>n</sub><sup>2</sup></span></span>
        <span class="vals"><i>K</i> = 3.40,&nbsp; &omega;<sub>n</sub> = 1.00 rad/s,&nbsp; &zeta; = 0.06</span>
      </p>

      <div class="stack">
        <figure>
          <figcaption>Input and output in time &mdash; <span style="color:var(--blue)">u</span>, <span style="color:var(--red)">y</span></figcaption>
          <svg id="time" viewBox="0 0 420 118"></svg>
        </figure>
        <figure>
          <figcaption>Magnitude, dB</figcaption>
          <svg id="mag" viewBox="0 0 420 86"></svg>
        </figure>
        <figure>
          <figcaption>Phase, degrees</figcaption>
          <svg id="phase" viewBox="0 0 420 86"></svg>
        </figure>
        <figure>
          <figcaption>Roots of the denominator</figcaption>
          <svg id="pz-tf" viewBox="0 0 420 118"></svg>
        </figure>
      </div>
    </section>

    <div class="rule" aria-hidden="true">
      <span class="equiv">&#8801;</span>
      <span class="conv">the same system, both ways<code>ss(G) &nbsp; &#8596; &nbsp; tf(sys)</code></span>
    </div>

    <!-- ------------------------------------------------------ state space -->
    <section class="view right" aria-label="State space">
      <h2>State space</h2>

      <svg viewBox="0 0 420 124" role="img" aria-label="u through B to a summing junction, integrated to x, out through C to y, with A fed back">
        <line x1="20" y1="34" x2="56" y2="34" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <rect x="58" y="18" width="40" height="32" fill="none" stroke="#1D1D1B"/>
        <line x1="98" y1="34" x2="124" y2="34" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <circle cx="134" cy="34" r="10" fill="none" stroke="#1D1D1B"/>
        <line x1="144" y1="34" x2="196" y2="34" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <rect x="198" y="14" width="46" height="40" fill="none" stroke="#1D1D1B"/>
        <line x1="244" y1="34" x2="316" y2="34" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <rect x="318" y="18" width="40" height="32" fill="none" stroke="#1D1D1B"/>
        <line x1="358" y1="34" x2="402" y2="34" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <!-- the feedback path: x back through A, into the junction from below -->
        <polyline points="278,34 278,96 200,96" fill="none" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <rect x="152" y="80" width="46" height="32" fill="none" stroke="#1D1D1B"/>
        <polyline points="152,96 134,96 134,46" fill="none" stroke="#1D1D1B" marker-end="url(#ah)"/>
        <circle cx="278" cy="34" r="2.5" fill="#1D1D1B"/>
        <text class="sig" x="6" y="38">u</text>
        <text class="mat" x="72" y="39">B</text>
        <text class="mat" x="213" y="40" font-size="20">&#8747;</text>
        <text class="mat" x="332" y="39">C</text>
        <text class="mat" x="167" y="101">A</text>
        <text class="sig" x="160" y="29">x&#775;</text>
        <text class="sig" x="286" y="29">x</text>
        <text class="sig" x="406" y="38">y</text>
        <text x="122" y="30" font-size="10">+</text>
        <text x="122" y="48" font-size="10">+</text>
      </svg>

      <div class="stack">
        <div>
          <p class="eqns">
            <i>x&#775;</i> = <b>A</b><i>x</i> + <b>B</b><i>u</i><br>
            <i>y</i> = <b>C</b><i>x</i> <span class="faint">[ + <b>D</b><i>u</i> ]</span>
          </p>
        </div>
        <div class="numbers">
          <span class="matrix"><span class="bracket">[</span><span class="rows"><span>0&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;1</span><span id="m-a">&minus;1.00 &minus;0.12</span></span><span class="bracket">]</span></span>
          <span class="lbl"><b>A</b></span>
          <span class="matrix"><span class="bracket">[</span><span class="rows"><span>0</span><span>1</span></span><span class="bracket">]</span></span>
          <span class="lbl"><b>B</b></span>
          <span class="matrix"><span class="bracket">[</span><span class="rows"><span id="m-c">3.40&nbsp;&nbsp;0</span></span><span class="bracket">]</span></span>
          <span class="lbl"><b>C</b></span>
          <span class="matrix"><span class="bracket">[</span><span class="rows"><span>0</span></span><span class="bracket">]</span></span>
          <span class="lbl"><b>D</b></span>
        </div>
        <div class="pair">
          <figure>
            <figcaption>Eigenvalues of <b>A</b></figcaption>
            <svg id="pz-ss" viewBox="0 0 300 150"></svg>
          </figure>
          <figure>
            <figcaption>The state, in its own plane</figcaption>
            <svg id="plane" viewBox="0 0 300 150"></svg>
          </figure>
        </div>
      </div>
    </section>
  </div>

  <div class="controls">
    <label for="w">Input frequency &omega; <output id="w-out" for="w"></output></label>
    <input id="w" type="range" min="-1.1" max="1.2" step="0.005" value="-0.7"
           aria-describedby="readout">
    <span class="readout" id="readout"></span>
    <button type="button" id="play" aria-pressed="true">Pause</button>
  </div>
</main>

<!-- The plant, and only the plant: the same constants the week-one applet and
     docs/laboratory/code/elevation_plant.json use, so the rig behaves the same
     wherever it is drawn. scripts/test-applets.mjs checks that file against the
     Python, which means this page cannot quietly drift from the measurement. -->
<script src="prop-core.js"></script>
<script>
(function () {
  "use strict";

  var P = globalThis.PropCore.PLANT;            // K, wn, zeta

  // ---------------------------------------------------------------- maths
  //
  // The measured elevation axis, as a transfer function and as a state-space
  // model of the same thing:
  //
  //   G(s) = K wn^2 / (s^2 + 2 zeta wn s + wn^2)
  //
  //   A = [0 1; -wn^2  -2 zeta wn],  B = [0; 1],  C = [K wn^2  0],  D = 0
  //
  // That A is the companion matrix of the denominator, so its characteristic
  // polynomial IS the denominator and its eigenvalues ARE the poles. The two
  // pole plots on this page are computed by the two different routes on
  // purpose: left from the polynomial, right from the matrix.
  var A = [[0, 1], [-P.wn * P.wn, -2 * P.zeta * P.wn]];

  function response(w) {                        // G(jw)
    var re = P.wn * P.wn - w * w, im = 2 * P.zeta * P.wn * w;
    var den = re * re + im * im, num = P.K * P.wn * P.wn;
    return { re: num * re / den, im: -num * im / den,
             mag: num / Math.sqrt(den), phase: -Math.atan2(im, re) };
  }

  // Eigenvalues of a 2x2, from its trace and determinant. Written out rather
  // than taken from the pole formula, because the whole point of the right
  // hand plot is that it did not start from the polynomial.
  function eig2(M) {
    var tr = M[0][0] + M[1][1];
    var det = M[0][0] * M[1][1] - M[0][1] * M[1][0];
    var disc = tr * tr - 4 * det;
    if (disc >= 0) {
      var r = Math.sqrt(disc);
      return [{ re: (tr + r) / 2, im: 0 }, { re: (tr - r) / 2, im: 0 }];
    }
    var i = Math.sqrt(-disc) / 2;
    return [{ re: tr / 2, im: i }, { re: tr / 2, im: -i }];
  }

  // ---------------------------------------------------------------- drawing
  var NS = "http://www.w3.org/2000/svg";
  function el(name, attrs, text) {
    var n = document.createElementNS(NS, name);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (text != null) n.textContent = text;
    return n;
  }
  function clear(svg) { while (svg.firstChild) svg.removeChild(svg.firstChild); }
  function path(pts, stroke, width) {
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(2) + " " + p[1].toFixed(2); }).join(" ");
    return el("path", { d: d, fill: "none", stroke: stroke, "stroke-width": width || 1.6,
                        "stroke-linejoin": "round", "stroke-linecap": "round" });
  }

  // A box with left and bottom axes, and the plotting area inside it.
  function frame(svg, w, h) {
    var m = { l: 34, r: 6, t: 8, b: 16 };
    svg.appendChild(el("line", { x1: m.l, y1: h - m.b, x2: w - m.r, y2: h - m.b, stroke: "#9aa0a0" }));
    svg.appendChild(el("line", { x1: m.l, y1: m.t, x2: m.l, y2: h - m.b, stroke: "#9aa0a0" }));
    return { x0: m.l, x1: w - m.r, y0: m.t, y1: h - m.b };
  }

  var WMIN = 0.08, WMAX = 16;                   // the slider's decade range
  function wToX(w, b) {
    return b.x0 + (b.x1 - b.x0) * (Math.log10(w) - Math.log10(WMIN)) /
                                  (Math.log10(WMAX) - Math.log10(WMIN));
  }

  // Bode: magnitude and phase, drawn once, with a marker that moves.
  var BODE = [];
  for (var i = 0; i <= 240; i++) {
    var w = Math.pow(10, Math.log10(WMIN) + (Math.log10(WMAX) - Math.log10(WMIN)) * i / 240);
    BODE.push({ w: w, r: response(w) });
  }
  var DB_LO = -40, DB_HI = 35;

  function drawBode() {
    var svgM = document.getElementById("mag"), svgP = document.getElementById("phase");
    clear(svgM); clear(svgP);
    var bM = frame(svgM, 420, 86), bP = frame(svgP, 420, 86);

    [[-20, bM], [0, bM], [20, bM]].forEach(function (g) {
      var y = g[1].y1 - (g[1].y1 - g[1].y0) * (g[0] - DB_LO) / (DB_HI - DB_LO);
      svgM.appendChild(el("line", { x1: bM.x0, y1: y, x2: bM.x1, y2: y, stroke: "#e3e6e5" }));
      svgM.appendChild(el("text", { x: 4, y: y + 4 }, String(g[0])));
    });
    [[0, bP], [-90, bP], [-180, bP]].forEach(function (g) {
      var y = bP.y0 + (bP.y1 - bP.y0) * (-g[0]) / 180;
      svgP.appendChild(el("line", { x1: bP.x0, y1: y, x2: bP.x1, y2: y, stroke: "#e3e6e5" }));
      svgP.appendChild(el("text", { x: 4, y: y + 4 }, String(g[0])));
    });

    svgM.appendChild(path(BODE.map(function (p) {
      var db = 20 * Math.log10(p.r.mag);
      return [wToX(p.w, bM), bM.y1 - (bM.y1 - bM.y0) * (db - DB_LO) / (DB_HI - DB_LO)];
    }), "#1f6f8b"));
    svgP.appendChild(path(BODE.map(function (p) {
      var deg = p.r.phase * 180 / Math.PI;
      return [wToX(p.w, bP), bP.y0 + (bP.y1 - bP.y0) * (-deg) / 180];
    }), "#1f6f8b"));

    return { bM: bM, bP: bP, svgM: svgM, svgP: svgP };
  }

  // The pole-zero maps. Same axes both sides, so the eye can go straight
  // across and find the crosses in the same place.
  function box(svg) {
    var v = svg.getAttribute("viewBox").split(/\s+/).map(Number);
    return { w: v[2], h: v[3] };
  }

  function drawPZ(svgId, poles, label) {
    var svg = document.getElementById(svgId);
    clear(svg);
    var b = box(svg), w = b.w, h = b.h, cx = w * 0.5, cy = h / 2;
    var sx = w * 0.40, sy = h * 0.39;
    svg.appendChild(el("line", { x1: 16, y1: cy, x2: w - 16, y2: cy, stroke: "#9aa0a0" }));
    svg.appendChild(el("line", { x1: cx, y1: 8, x2: cx, y2: h - 8, stroke: "#9aa0a0" }));
    svg.appendChild(el("text", { x: w - 30, y: cy - 6 }, "Re"));
    svg.appendChild(el("text", { x: cx + 6, y: 16 }, "Im"));
    poles.forEach(function (p) {
      var x = cx + p.re * sx, y = cy - p.im * sy, r = 5;
      svg.appendChild(el("line", { x1: x - r, y1: y - r, x2: x + r, y2: y + r, stroke: "#B01C2E", "stroke-width": 2.2 }));
      svg.appendChild(el("line", { x1: x - r, y1: y + r, x2: x + r, y2: y - r, stroke: "#B01C2E", "stroke-width": 2.2 }));
    });
    svg.appendChild(el("text", { x: 16, y: h - 2, "font-size": 10 }, label));
  }

  // ---------------------------------------------------------------- the loop
  var bode = drawBode();
  var marker = {
    m: el("circle", { r: 4.5, fill: "#B01C2E" }),
    p: el("circle", { r: 4.5, fill: "#B01C2E" }),
    lm: el("line", { stroke: "#B01C2E", "stroke-dasharray": "3 3", "stroke-width": 1 }),
    lp: el("line", { stroke: "#B01C2E", "stroke-dasharray": "3 3", "stroke-width": 1 })
  };
  bode.svgM.appendChild(marker.lm); bode.svgM.appendChild(marker.m);
  bode.svgP.appendChild(marker.lp); bode.svgP.appendChild(marker.p);

  var den = [1, 2 * P.zeta * P.wn, P.wn * P.wn];
  var discr = den[1] * den[1] - 4 * den[0] * den[2];
  var tfPoles = discr >= 0
    ? [{ re: (-den[1] + Math.sqrt(discr)) / 2, im: 0 }, { re: (-den[1] - Math.sqrt(discr)) / 2, im: 0 }]
    : [{ re: -den[1] / 2, im: Math.sqrt(-discr) / 2 }, { re: -den[1] / 2, im: -Math.sqrt(-discr) / 2 }];
  drawPZ("pz-tf", tfPoles, "roots of s² + 2ζωₙs + ωₙ²");
  drawPZ("pz-ss", eig2(A), "eig(A)");

  var slider = document.getElementById("w"), wOut = document.getElementById("w-out");
  var readout = document.getElementById("readout"), playBtn = document.getElementById("play");
  var svgT = document.getElementById("time");
  var playing = true, t = 0, last = null;

  // ?w=2.4 opens at that frequency, which is how a slide links to the point it
  // wants and how scripts/capture-stills.mjs takes the printed version.
  var asked = Number(new URLSearchParams(location.search).get("w"));
  if (isFinite(asked) && asked > 0) {
    slider.value = Math.min(Number(slider.max),
                   Math.max(Number(slider.min), Math.log10(asked)));
  }
  if (new URLSearchParams(location.search).get("still") === "1") playing = false;

  function omega() { return Math.pow(10, Number(slider.value)); }

  var svgPlane = document.getElementById("plane");

  function drawPlane(w, r) {
    clear(svgPlane);
    var b = box(svgPlane), W = b.w, H = b.h, cx = W * 0.5, cy = H / 2;
    var a = r.mag / (P.K * P.wn * P.wn);       // amplitude of x1
    var b = w * a;                             // amplitude of x2
    var s = 0.86 * Math.min(cx - 16, cy - 10) / Math.max(a, b);

    svgPlane.appendChild(el("line", { x1: 16, y1: cy, x2: W - 16, y2: cy, stroke: "#9aa0a0" }));
    svgPlane.appendChild(el("line", { x1: cx, y1: 8, x2: cx, y2: H - 8, stroke: "#9aa0a0" }));
    svgPlane.appendChild(el("text", { x: W - 34, y: cy - 6 }, "x\u2081"));
    svgPlane.appendChild(el("text", { x: cx + 6, y: 16 }, "x\u2082"));

    var pts = [];
    for (var i = 0; i <= 96; i++) {
      var th = 2 * Math.PI * i / 96;
      pts.push([cx + s * a * Math.sin(th), cy - s * b * Math.cos(th)]);
    }
    svgPlane.appendChild(path(pts, "#d7dbda", 1.6));

    var ph = w * t + r.phase;
    var px = cx + s * a * Math.sin(ph), py = cy - s * b * Math.cos(ph);
    svgPlane.appendChild(el("line", { x1: cx, y1: cy, x2: px, y2: py,
                                      stroke: "#1D1D1B", "stroke-width": 1.8 }));
    svgPlane.appendChild(el("circle", { cx: px, cy: py, r: 4, fill: "#B01C2E" }));
  }

  function drawTime(w, r) {
    clear(svgT);
    var b = frame(svgT, 420, 118);
    var span = 5 * 2 * Math.PI / w;             // five periods, whatever w is
    var amp = Math.max(1.25, 1.12 * r.mag);     // u is 1, so this always fits u
    var mid = (b.y0 + b.y1) / 2, half = (b.y1 - b.y0) / 2;
    svgT.appendChild(el("line", { x1: b.x0, y1: mid, x2: b.x1, y2: mid, stroke: "#e3e6e5" }));
    svgT.appendChild(el("text", { x: 2, y: b.y0 + 9 }, amp.toFixed(1)));
    svgT.appendChild(el("text", { x: 2, y: b.y1 }, (-amp).toFixed(1)));

    var pu = [], py = [], n = 260;
    for (var i = 0; i <= n; i++) {
      var tt = t + span * i / n, x = b.x0 + (b.x1 - b.x0) * i / n;
      pu.push([x, mid - half * Math.sin(w * tt) / amp]);
      py.push([x, mid - half * r.mag * Math.sin(w * tt + r.phase) / amp]);
    }
    svgT.appendChild(path(pu, "#1f6f8b", 1.5));
    svgT.appendChild(path(py, "#B01C2E", 2.1));
  }

  function render() {
    var w = omega(), r = response(w);
    wOut.textContent = w.toFixed(2) + " rad/s";
    readout.innerHTML = "gain <b>" + r.mag.toFixed(2) + "</b> (" +
      (20 * Math.log10(r.mag)).toFixed(1) + " dB) &nbsp; phase <b>" +
      (r.phase * 180 / Math.PI).toFixed(0) + "&deg;</b>";

    var x = wToX(w, bode.bM);
    var db = 20 * Math.log10(r.mag);
    var ym = bode.bM.y1 - (bode.bM.y1 - bode.bM.y0) * (db - DB_LO) / (DB_HI - DB_LO);
    var yp = bode.bP.y0 + (bode.bP.y1 - bode.bP.y0) * (-r.phase * 180 / Math.PI) / 180;
    marker.m.setAttribute("cx", x); marker.m.setAttribute("cy", ym);
    marker.p.setAttribute("cx", x); marker.p.setAttribute("cy", yp);
    marker.lm.setAttribute("x1", x); marker.lm.setAttribute("x2", x);
    marker.lm.setAttribute("y1", bode.bM.y0); marker.lm.setAttribute("y2", bode.bM.y1);
    marker.lp.setAttribute("x1", x); marker.lp.setAttribute("x2", x);
    marker.lp.setAttribute("y1", bode.bP.y0); marker.lp.setAttribute("y2", bode.bP.y1);

    drawTime(w, r);
    drawPlane(w, r);
  }

  function frameStep(ts) {
    if (last != null && playing) t += Math.min(0.05, (ts - last) / 1000);
    last = ts;
    if (playing) render();
    requestAnimationFrame(frameStep);
  }

  slider.addEventListener("input", render);
  playBtn.addEventListener("click", function () {
    playing = !playing;
    playBtn.textContent = playing ? "Pause" : "Play";
    playBtn.setAttribute("aria-pressed", String(playing));
  });

  render();
  requestAnimationFrame(frameStep);
})();
</script>
</body>
</html>
