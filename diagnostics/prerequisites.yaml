# The prerequisite diagnostic, as data.
#
# scripts/build_numbas.py turns this into prerequisites.exam, for upload to
# the Numbas editor, and writes the readable question list into
# prerequisites.md between its markers. Edit here, not there.
#
# Formative: it doesn't contribute to the unit grade. No randomisation (AP11) —
# every student gets the same questions.
#
# Feedback is in two layers, and both are shown whatever the student answered:
#
#   why     per choice. Every option has one, right and wrong alike. A student
#           who guessed right learns why it was right; a student who missed it
#           is told which misconception they have, not merely that they erred.
#   advice  the worked route, shared by everyone. Steps, not just the answer.
#
# **Every wrong option is a real mistake someone makes.** None is filler. That
# is what makes the cohort results diagnostic rather than just a score: if
# thirty people pick the sensitivity function in Q6, that is a lecture to give.
#
# Maths is LaTeX between \( \), which is what Numbas expects inside HTML.
# Numeric answers were computed with python-control, not typed; the script
# re-checks them on every build.

# Bump while reviewing: the name gets "(draft N)" so successive uploads are
# distinguishable in the Numbas editor, which duplicates rather than replaces.
# Delete this line for the version that goes live.
draft: 1
name: "CADE30008 Control: prerequisite diagnostic"
description: >-
  Ten questions on the mathematics and control this unit builds on. Formative:
  it does not contribute to your grade. Every question gives you feedback on
  what you chose and how to get to the answer, so it is worth reading even the
  ones you got right.

questions:
  - id: transfer-function
    name: From an equation to a transfer function
    checks: Laplace transform of a derivative with zero initial conditions
    statement: >-
      A system obeys \( \dot y + 2y = u \), starting from rest, where \( u \)
      is the input and \( y \) the output. What is its transfer function
      \( Y(s)/U(s) \)?
    type: choice
    choices:
      - text: "\\( \\dfrac{1}{s+2} \\)"
        correct: true
        why: >-
          Right. Every term transforms, the \( s \) stays with \( Y \) on the
          left, and what's left on top is the coefficient of \( u \).
      - text: "\\( \\dfrac{s}{s+2} \\)"
        why: >-
          The \( s \) from \( \dot y \) has ended up in the numerator. It belongs
          with \( y \): the left-hand side collects to \( (s+2)Y \), so the
          numerator is whatever multiplies \( u \), which here is 1.
      - text: "\\( \\dfrac{2}{s+1} \\)"
        why: >-
          The two coefficients have swapped. The coefficient of \( y \), which is
          2, joins \( s \) in the denominator; the coefficient of \( u \), which
          is 1, is the numerator.
      - text: "\\( s + 2 \\)"
        why: >-
          That's the characteristic polynomial, or equivalently \( U/Y \) — the
          right answer upside down. A transfer function is always output over
          input.
    advice: |
      - Transform every term, using \( \dot y \to sY \) because the system starts from rest. That gives \( sY + 2Y = U \).
      - Collect \( Y \): \( (s+2)Y = U \).
      - Divide: \( Y/U = \dfrac{1}{s+2} \).

      The denominator, \( s+2 \), is the characteristic polynomial, and its root
      \( s = -2 \) is the pole. You will do this for every block diagram in the
      unit, so practise until it is quick.
    worked: |
      **1. Write down what the Laplace transform does to each term.**

      For a derivative the transform is

      $$ \mathcal{L}\{\dot y(t)\} = sY(s) - y(0), $$

      and for the undifferentiated terms it is just \( \mathcal{L}\{y(t)\} = Y(s) \)
      and \( \mathcal{L}\{u(t)\} = U(s) \).

      **2. Use "starting from rest".**

      It means \( y(0) = 0 \), so the \( -y(0) \) term disappears and
      \( \mathcal{L}\{\dot y\} = sY(s) \). Without that condition there is no
      single transfer function to find, because the answer would depend on where
      the system started.

      **3. Transform the whole equation.**

      $$ \dot y + 2y = u \quad \longrightarrow \quad sY(s) + 2Y(s) = U(s). $$

      **4. Collect the output terms.**

      Both terms on the left have \( Y(s) \) in them, so take it outside:

      $$ (s + 2)\,Y(s) = U(s). $$

      **5. Divide to get output over input.**

      $$ \frac{Y(s)}{U(s)} = \frac{1}{s+2}. $$

      **6. Check it.** Two quick tests. Do both every time.

      - **Shape.** One derivative of \( y \) should give one power of \( s \) in
        the denominator. It does.
      - **Steady state.** Set \( s = 0 \) to get \( Y/U = 1/2 \), so a steady
        input of 1 settles the output at 0.5. Setting \( \dot y = 0 \) in the
        original equation gives \( 2y = u \), and so \( y = 0.5 \). They agree.

  - id: poles
    name: Poles and what they mean
    checks: reading stability and oscillation from pole locations
    statement: >-
      A system has transfer function \( G(s) = \dfrac{5}{s^2 + 2s + 5} \), whose
      poles are at \( -1 \pm 2j \). Its step response is:
    type: choice
    choices:
      - text: "unstable"
        why: >-
          Stability is decided by the *real* part, and here it is \( -1 \).
          A complex pole isn't unstable in itself — it's what makes a response
          oscillate rather than what makes it grow.
      - text: "stable, and settles without oscillating"
        why: >-
          The stability half is right, but the \( \pm 2j \) has been dropped. A
          non-zero imaginary part means the response oscillates on its way in,
          here at 2 rad/s.
      - text: "stable, with a decaying oscillation"
        correct: true
        why: >-
          Right — and you read both halves. Real part negative, so it decays;
          imaginary part non-zero, so it oscillates while decaying.
      - text: "an oscillation that never decays"
        why: >-
          That needs the poles *on* the imaginary axis, at \( \pm 2j \) with no
          real part at all. The \( -1 \) is what makes it die away.
    steps_image: diagnostics/figures/pole-locations.png
    steps_image_alt: >-
      The complex plane. The left half is shaded and labelled "response
      decays", the right half "response grows". Four pole locations are marked
      and numbered, and the shape of each one's response is drawn below: a
      conjugate pair in the left half decays while ringing; a single real pole
      the same distance to the left decays without ringing; a pair on the
      vertical axis rings for ever; a pair in the right half grows while
      ringing. Arrows note that further left means faster decay, and higher up
      means faster ringing.
    advice: |
      Read a complex pair \( \sigma \pm j\omega_\mathrm{d} \) as two separate facts:

      - **the real part \( \sigma \) sets the envelope.** Negative decays like \( e^{\sigma t} \), positive grows, zero neither.
      - **the imaginary part \( \omega_\mathrm{d} \) sets the ringing.** Non-zero means it oscillates at \( \omega_\mathrm{d} \) rad/s; zero means it doesn't.

      Here \( \sigma = -1 \) and \( \omega_\mathrm{d} = 2 \), so the response rings at
      2 rad/s inside an \( e^{-t} \) envelope, most of it gone within about four
      seconds. That is case 1 in the figure below, and each of the other three
      is one of the answers you could have chosen.

      The numerator does not change that shape, but it does set where the
      response ends up. Putting \( s = 0 \) gives \( G(0) = \frac{5}{5} = 1 \), so
      by the final value theorem the step settles at exactly 1. The poles say
      what it does on the way; the DC gain says where it stops.

  - id: wn-zeta
    name: Natural frequency and damping ratio
    checks: the standard second-order form
    statement: >-
      A system has transfer function \( G(s) = \dfrac{25}{s^2 + 4s + 25} \).
      Comparing it with the standard second-order form
      \( G(s) = \dfrac{\omega_\mathrm{n}^2}{s^2 + 2\zeta\omega_\mathrm{n}s + \omega_\mathrm{n}^2} \),
      give the natural frequency \( \omega_\mathrm{n} \), in rad/s, and the
      damping ratio \( \zeta \).
    type: numbers
    answers:
      - {label: "\\( \\omega_\\mathrm{n} \\) (rad/s)", value: 5, tolerance: 0.01}
      - {label: "\\( \\zeta \\)", value: 0.4, tolerance: 0.01}
    common_errors:
      - value: "\\( \\omega_\\mathrm{n} = 25 \\)"
        why: >-
          that's \( \omega_\mathrm{n}^2 \). The constant term is the square, so take the
          root.
      - value: "\\( \\zeta = 0.16 \\)"
        why: >-
          you divided 4 by \( \omega_\mathrm{n}^2 \). The middle coefficient is
          \( 2\zeta\omega_\mathrm{n} \), so divide by \( 2\omega_\mathrm{n} = 10 \).
      - value: "\\( \\zeta = 0.8 \\)"
        why: >-
          you divided by \( \omega_\mathrm{n} \) but not by the 2. It is easy to lose;
          the factor of 2 is there so that \( \zeta = 1 \) is exactly critical
          damping.
      - value: "\\( \\zeta = 2 \\)"
        why: >-
          that's \( \zeta\omega_\mathrm{n} \), which is the decay rate \( \sigma \) — a
          useful number, but not the damping ratio.
    advice: |
      Match the denominator against the standard form
      \( s^2 + 2\zeta\omega_\mathrm{n} s + \omega_\mathrm{n}^2 \), one coefficient at a time:

      - **constant term:** \( \omega_\mathrm{n}^2 = 25 \), so \( \omega_\mathrm{n} = 5 \) rad/s.
      - **middle term:** \( 2\zeta\omega_\mathrm{n} = 4 \), and \( \omega_\mathrm{n} \) is now known, so \( \zeta = 4/(2 \times 5) = 0.4 \).

      Always do them in that order — the middle term needs \( \omega_\mathrm{n} \), so
      there is nothing to be gained by starting there. A quick check: \( \zeta \)
      between 0 and 1 means an oscillatory response, which matches the complex
      poles this denominator has.

  - id: overshoot
    name: Overshoot
    checks: the link between damping and overshoot
    statement: >-
      A second-order system with damping ratio \( \zeta = 0.4 \) is given a
      step input. Its overshoot — how far the response goes past its final
      value, as a percentage of it — is closest to:
    type: choice
    choices:
      - text: "5%"
        why: >-
          That's roughly \( \zeta = 0.7 \) — the value often quoted as a good
          compromise, so it is an easy one to reach for. This system is less
          damped than that.
      - text: "10%"
        why: >-
          That's roughly \( \zeta = 0.6 \). You're in the right region but a
          little too damped; the relationship is steep here, so small changes in
          \( \zeta \) move the overshoot a lot.
      - text: "25%"
        correct: true
        why: >-
          Right. \( M_\mathrm{p} = 25.4\% \), and the useful thing to carry away is the
          pairing: \( \zeta = 0.4 \) with about a quarter overshoot.
      - text: "50%"
        why: >-
          That's roughly \( \zeta = 0.2 \), considerably livelier than this. Half
          the height of the step as overshoot would be a very underdamped system.
    steps_image: diagnostics/figures/overshoot-vs-damping.png
    steps_image_alt: >-
      Overshoot plotted against damping ratio: a curve falling steeply from
      nearly 100 per cent at very light damping to almost nothing by a damping
      ratio of 0.9. Three points are marked with dropped lines to both axes -
      0.2 giving 53 per cent, 0.4 giving 25 per cent, and 0.7 giving 5 per
      cent. A shaded band either side of 0.4 shows that changing the damping
      ratio by 0.05 changes the overshoot by about 5 percentage points.
    advice: |
      Exactly, \( M_\mathrm{p} = e^{-\pi\zeta/\sqrt{1-\zeta^2}} \), which for
      \( \zeta = 0.4 \) gives 0.254, so about 25%.

      You may have met this written as
      \( M_\mathrm{p} = 100e^{-\zeta\omega_\mathrm{n}t_\mathrm{p}}\% \), which is
      the same thing: substitute the peak time
      \( t_\mathrm{p} = \pi/\omega_\mathrm{d} \) and the
      \( \omega_\mathrm{n} \) cancels, leaving the form above. That version
      needs the peak time first; this one does not, which is why it is the one
      worth remembering.

      In practice nobody evaluates that in a design meeting. Carry three anchors
      instead and interpolate:

      - \( \zeta = 0.2 \) → about 50%
      - \( \zeta = 0.4 \) → about 25%
      - \( \zeta = 0.7 \) → about 5%

      Less damping, more overshoot, and the curve is steep. That steepness is
      why phase margin — the frequency-domain cousin of damping — is worth
      watching closely once we get to it.

  - id: steady-state
    name: Steady state
    checks: the final value theorem, or DC gain
    statement: >-
      A system has transfer function \( G(s) = \dfrac{3}{s+2} \). What value
      does its response to a unit step settle to?
    type: numbers
    answers:
      - {label: "final value", value: 1.5, tolerance: 0.01}
    common_errors:
      - value: "3"
        why: >-
          you took the numerator alone. Setting \( s = 0 \) leaves the
          denominator's constant term too, so it's \( 3/2 \), not 3.
      - value: "0"
        why: >-
          you may have applied \( \lim_{s \to 0} sG(s) \), which is the final
          value of the *impulse* response. For a step the \( s \) in the theorem
          cancels the \( 1/s \) of the step itself.
      - value: "0.667"
        why: >-
          that's \( 2/3 \) — the right two numbers, inverted.
    advice: |
      The steady-state value of a step response is just \( G(0) \), the DC gain.
      Set \( s = 0 \): \( G(0) = 3/2 = 1.5 \).

      If you would rather use the final value theorem, the step is \( 1/s \), so

      $$ \lim_{s\to0} s \cdot G(s) \cdot \frac{1}{s} = \lim_{s\to0} G(s) = G(0). $$

      The \( s \) and the \( 1/s \) cancel, which is why the shortcut works. The
      theorem is only valid when the response actually settles, so check the
      poles are in the left half plane first — here the single pole is at
      \( s = -2 \), so it does.

  - id: closing-the-loop
    name: Closing the loop
    checks: "\\( G/(1+G) \\), the step everything in the unit builds on"
    statement: >-
      A plant \( G(s) = \dfrac{4}{s(s+1)} \) is put in a unity negative
      feedback loop, with reference \( R(s) \) and output \( Y(s) \). The
      closed-loop transfer function \( T(s) = Y(s)/R(s) \) is:
    type: choice
    choices:
      - text: "\\( \\dfrac{4}{s^2 + s + 4} \\)"
        correct: true
        why: >-
          Right. \( T = G/(1+G) \), then multiply top and bottom by
          \( s(s+1) \) to clear the fraction within a fraction.
      - text: "\\( \\dfrac{4}{s^2 + s - 4} \\)"
        why: >-
          A sign error: this is \( G/(1-G) \), which is *positive* feedback. The
          sign is the whole point — this version has a pole in the right half
          plane and would run away.
      - text: "\\( \\dfrac{4}{s^2 + s} \\)"
        why: >-
          That's the open loop \( G \) with its denominator multiplied out. The
          loop hasn't been closed: there is no \( +4 \) contributed by the
          feedback path.
      - text: "\\( \\dfrac{s^2 + s}{s^2 + s + 4} \\)"
        why: >-
          Very close, and worth having derived: that is the transfer function
          from the reference to the **error**, \( E/R = 1/(1+G) \), not to the
          output. The question asked for reference to output, which is
          \( T = G/(1+G) \). The two add to one, \( E/R + T = 1 \), which is a
          relationship this unit will come back to and give a name.
    advice: |
      - Write the closed-loop form: \( T = \dfrac{G}{1+G} \).
      - Substitute: \( T = \dfrac{4/(s(s+1))}{1 + 4/(s(s+1))} \).
      - Multiply top and bottom by \( s(s+1) \): \( T = \dfrac{4}{s(s+1) + 4} = \dfrac{4}{s^2+s+4} \).

      Two habits that save time later. **The closed-loop denominator is
      \( 1 + G \) cleared of fractions**, so you can often write it down without
      the algebra. And **the numerator of \( T \) is the numerator of \( G \)**,
      unchanged — feedback moves poles, never zeros.

      This one has \( \omega_\mathrm{n} = 2 \) and \( \zeta = 0.25 \), so expect a lively
      response with around 45% overshoot. The Quanser rig in the first session is
      far less damped still.

  - id: steady-state-error
    name: Steady-state error
    checks: steady-state error of a type 0 loop, and why integral action exists
    statement: >-
      The same unity negative feedback loop, but with a plant
      \( G(s) = \dfrac{4}{s+1} \). After a unit step in the reference
      \( R(s) \), what steady-state error \( e_\mathrm{ss} \) remains?
    type: numbers
    answers:
      - {label: "steady-state error", value: 0.2, tolerance: 0.01}
    common_errors:
      - value: "0.25"
        why: >-
          you used \( 1/G(0) \). The formula is \( 1/(1+G(0)) \), and that extra
          1 is the reference itself — the error is what the reference asks for
          minus what the loop delivers.
      - value: "0.8"
        why: >-
          that's the steady-state *output*, \( G(0)/(1+G(0)) \). The error is
          what's left over: \( 1 - 0.8 = 0.2 \).
      - value: "0"
        why: >-
          that would need an integrator in the loop. This plant has none — a pole
          at \( s = -1 \), not at the origin — so a finite error survives.
    advice: |
      - For unity feedback, the error transfer function is \( E/R = S = \dfrac{1}{1+G} \).
      - A unit step's final error is therefore \( e_\mathrm{ss} = \dfrac{1}{1+G(0)} \).
      - Here \( G(0) = 4 \), so \( e_\mathrm{ss} = 1/5 = 0.2 \) — a 20% error that never goes away.

      **Why it matters.** The only way to drive that to zero is to make
      \( G(0) \) infinite, which means putting an integrator in the loop: a pole
      at \( s = 0 \). That is exactly what the I in PID does, and it is the
      reason integral action exists at all rather than being an optional extra.

      Raising the gain instead shrinks the error but never removes it, and costs
      you damping on the way — the trade you will meet again in almost every week
      of this unit.

  - id: bode
    name: Reading a Bode plot
    checks: the corner frequency of a first-order lag
    statement: >-
      A system has transfer function \( G(s) = \dfrac{10}{s+10} \). At a
      frequency \( \omega = 10 \) rad/s, what are the magnitude of
      \( G(j\omega) \), in decibels, and its phase?
    type: choice
    choices:
      - text: "0 dB, 0°"
        why: >-
          Those are the low-frequency values, well *below* the corner. At
          \( \omega = 10 \) you are standing exactly on the corner, where the
          asymptotes meet and neither one is accurate.
      - text: "−3 dB, −45°"
        correct: true
        why: >-
          Right, and these two numbers travel together: every first-order corner
          is −3 dB and −45°, whatever the frequency. Worth memorising as a pair.
      - text: "−6 dB, −90°"
        why: >-
          −90° is the high-frequency limit, only approached well *above* the
          corner. At the corner the phase is exactly halfway there.
      - text: "−20 dB, −45°"
        why: >-
          The phase is right. −20 dB is the magnitude a *decade* above the
          corner, at \( \omega = 100 \), once the −20 dB/decade slope has had a
          full decade to act.
    advice: |
      A first-order lag \( \dfrac{1}{1 + s/\omega_\mathrm{c}} \) has three landmarks:

      - **well below \( \omega_\mathrm{c} \):** 0 dB and 0°. The system passes the signal through.
      - **at \( \omega_\mathrm{c} \):** \( |G| = 1/\sqrt2 \), which is −3 dB, and the phase is exactly −45°, halfway to its limit.
      - **well above \( \omega_\mathrm{c} \):** falling at −20 dB/decade, phase heading to −90°.

      Here \( G = 10/(s+10) = 1/(1 + s/10) \), so \( \omega_\mathrm{c} = 10 \) rad/s and
      the question is asking for the corner itself.

      **−3 dB and −45° at the corner is the single most reused fact in this
      unit.** Every lag you meet in weeks 4 and 8 is built from it.

  - id: decibels
    name: Decibels
    checks: the decibel scale, used on every Bode plot in the unit
    statement: >-
      A gain is quoted as 20 dB. As a plain multiplying factor, that is:
    type: choice
    choices:
      - text: "2"
        why: >-
          That's about 6 dB. The two worth knowing are 6 dB ≈ ×2 and
          20 dB = ×10 exactly.
      - text: "10"
        correct: true
        why: >-
          Right. \( 20\log_{10}(10) = 20 \) dB, so every 20 dB is another factor
          of ten.
      - text: "20"
        why: >-
          Decibels are a logarithmic scale, so the number is never the factor
          itself. If it were, the scale would be doing nothing.
      - text: "100"
        why: >-
          A factor of 100 is 40 dB, not 20 — you have gone one decade too far.
          Each ×10 adds 20 dB, so ×10 is 20 dB and ×100 is 40 dB. If you doubled
          the decibels when you meant to square the factor, that is the usual
          way round it happens.
    advice: |
      For a gain — an amplitude ratio, which is what a Bode magnitude plot
      shows — the definition is \( 20\log_{10}|G| \).

      Anchors worth carrying:

      - ×1 → 0 dB
      - ×2 → 6 dB (and ÷2 → −6 dB)
      - ×10 → 20 dB
      - ×100 → 40 dB

      The factor-of-two one is the one that slips. And note the **20** rather
      than **10**: the 10 version is for *power*, and power goes as amplitude
      squared, which is exactly where the factor of two in front comes from.

  - id: bode-second-order
    name: Reading a second-order system off its Bode plot
    checks: "the link between the time-domain parameters and the frequency response, and that the resonant peak is not at \\( \\omega_\\mathrm{n} \\)"
    statement: >-
      Below is the Bode plot of a second-order system
      \( G(s) = \dfrac{\omega_\mathrm{n}^2}{s^2 + 2\zeta\omega_\mathrm{n}s + \omega_\mathrm{n}^2} \),
      where \( \omega_\mathrm{n} \) is the natural frequency in rad/s and
      \( \zeta \) the damping ratio. Read \( \omega_\mathrm{n} \) and estimate
      \( \zeta \).
    image: diagnostics/figures/second-order-bode.png
    image_alt: >-
      Bode plot of a second-order system. The magnitude is flat at 0 decibels at
      low frequency, rises to a peak of about 8 decibels near 5 radians per
      second, then falls at 40 decibels per decade. The phase falls from 0
      degrees through minus 90 degrees at 5 radians per second towards minus 180
      degrees.
    type: numbers
    answers:
      - {label: "\\( \\omega_\\mathrm{n} \\) (rad/s)", value: 5, tolerance: 0.4}
      - {label: "\\( \\zeta \\)", value: 0.2, tolerance: 0.06}
    common_errors:
      - value: "\\( \\omega_\\mathrm{n} \\approx 4.8 \\)"
        why: >-
          you read the frequency of the **peak**. That is the resonant
          frequency, \( \omega_\mathrm{r} = \omega_\mathrm{n}\sqrt{1 - 2\zeta^2} \),
          which sits a little *below* \( \omega_\mathrm{n} \) and moves as the
          damping changes. The phase curve is the reliable one.
      - value: "\\( \\zeta \\approx 0.7 \\)"
        why: >-
          that would have no peak at all. Any peak in the magnitude means
          \( \zeta < 0.707 \); the taller the peak, the lighter the damping.
      - value: "\\( \\zeta \\approx 0.1 \\)"
        why: >-
          the right idea but too light. A peak of 8 dB is a factor of about 2.5;
          \( \zeta = 0.1 \) would give about 14 dB, which is a factor of 5.
    advice: |
      Two readings, and the second one is the point of the question.

      - **\( \omega_\mathrm{n} \) comes from the phase.** For any second-order system of this form the phase passes through exactly \( -90^\circ \) at \( \omega = \omega_\mathrm{n} \), whatever the damping. Here that is **5 rad/s**.
      - **\( \zeta \) comes from the height of the peak.** The peak is about 8 dB, which is a linear factor of \( M_\mathrm{r} = 10^{8/20} \approx 2.5 \), and \( M_\mathrm{r} = \dfrac{1}{2\zeta\sqrt{1-\zeta^2}} \), giving \( \zeta \approx 0.2 \).

      **The peak is not at \( \omega_\mathrm{n} \).** It sits at
      \( \omega_\mathrm{r} = \omega_\mathrm{n}\sqrt{1 - 2\zeta^2} \), which here is
      4.8 rad/s — close enough to be easy to mistake, and far enough to matter.
      The two coincide only when \( \zeta = 0 \), and above \( \zeta = 0.707 \)
      there is no peak at all.

      If you would rather not remember the \( M_\mathrm{r} \) formula, the
      qualitative version gets you most of the way: a peak means light damping,
      a big peak means very light damping, and no peak means \( \zeta \)
      at or above about 0.7.


  - id: what-feedback-does
    name: What feedback is for
    checks: the unit's first threshold concept — feedback is a trade, not a fix
    statement: >-
      Which of these does negative feedback <em>not</em> do, on its own —
      that is, with a sensor, a controller and a plant, but nothing else added?
    type: choice
    choices:
      - text: "Reduce the effect of disturbances on the output"
        why: >-
          It does do this — arguably the main reason feedback exists. A
          disturbance shows up in the measurement, the error changes, and the
          controller pushes back.
      - text: "Reduce the effect of changes in the plant's gain"
        why: >-
          It does do this. It is why a feedback design survives an aircraft
          getting lighter as it burns fuel, and it is what the sensitivity
          function measures.
      - text: "Make an unstable plant stable, with a suitable controller"
        why: >-
          It does do this, and you will see it in the first session: the Quanser
          rig cannot be flown open-loop by hand, and closing the loop is what
          makes it flyable.
      - text: "Remove the effect of sensor noise on the output"
        correct: true
        why: >-
          Right, and this is the one that catches people. Feedback acts on what
          the sensor *says*. It cannot tell noise from real motion, so it
          faithfully corrects for both.
    advice: |
      Feedback compares the reference with the **measurement**, not with the
      truth. Anything the sensor reports — real motion or noise — is treated
      identically, so noise is driven into the actuator and back out into the
      output.

      That is why more gain is not always better. Raising the loop gain
      suppresses disturbances *and* amplifies the effect of noise, and the two
      pull in opposite directions. There is no setting that wins both, only a
      choice about where to sit.

      **Feedback is a trade, not a fix.** It is the first idea this unit is
      built on, and the lecture on robustness is where that trade gets made
      deliberately rather than by accident.
