# What the live site, https://cade30008.github.io, shows.
#
# The in-progress site (npm run serve) shows everything. The live site shows
# only the pages listed here, and scripts/build_live.py enforces it:
#
#   - a page not listed here is left out, and so is its week folder;
#   - a link from a published page to an unpublished one becomes plain text, so
#     nothing dangles and nothing unfinished is reachable;
#   - anything in a published page between <!-- in-progress:start --> and
#     <!-- in-progress:end --> is removed;
#   - the built site's own links are then checked, and the build fails if any
#     are broken.
#
# To publish a page, add it here, run `npm run preview:live` and look at it on
# http://localhost:8012, then commit and push. Publishing a lecture week means
# listing its handout, example sheet and solutions.

site_url: https://cade30008.github.io/

pages:
  - index.md
  - curriculum.md
  - preparing/index.md
  - reading.md
  - notation.md
  - glossary.md
  - about.md
  - ai.md
  # Week 1. Published on Steve's instruction, 22 September, the morning it is
  # taught. Publishing a lecture week means its handout, example sheet and
  # solutions; the code and data pages go with them because the session cannot
  # be done without the files they point at.
  - w01-design-cycle/index.md
  - w01-design-cycle/example-sheet.md
  - w01-design-cycle/solutions.md
  - w01-design-cycle/code/index.md
  - w01-design-cycle/data/README.md

  # The open-access laboratory material. Steve asked for it on the public
  # site, 21 September. Unlike the staff pages these are for students, so they
  # are in the navigation too.
  - laboratory/index.md
  - laboratory/part1-identify.md
  - laboratory/part2-design.md
  - laboratory/part3-validate.md
  - laboratory/code/index.md

  # The staff area, at /staff/. Not in the nav, deliberately: reachable by
  # anyone given the link, and not stumbled on. None of it is secret and none
  # of it is anything students need. It reads like what it is, with pedagogy
  # codes, hooks written as hooks, and draft markers on the weeks that are not
  # written yet.
  #
  # Nothing with a student's name on it, and nothing about assessment, goes
  # anywhere near these pages. That material lives in private/ and is never
  # committed.
  - staff/index.md
  - staff/w01-run-sheet.md
  - staff/wiring.md
  - staff/lecture-map.html

# tracking: status=draft version=0 assisted=true
