# Term-level facts for the control half, 2026/27: what isn't about one week's
# content. The content of each week is in weeks.yaml.
#
# The calendar: twelve weeks. Week 6 is the University's consolidation week, with
# no lectures of any kind. Week 12 is revision week, for units with exams; this
# unit's coursework is already in by then, so nothing is planned for it.

year: 2026/27
day: Tuesday
consolidation_week: 6
revision_week: 12

# The coursework follows the calendar. "step" is P17's "feed the design" part
# for each week.
coursework:
  deadline: {week: 11, day: Thursday}
  steps:
    - {week: 1, event: Brief released, step: "Read the brief; get your variant from cade30008.inputs; first decision-log entry"}
    - {week: 2, step: "Explore your aircraft variant and the flight-test tool"}
    - {week: 3, step: "Draft section 1, requirements, and section 2, model validation"}
    - {week: 4, event: Checkpoint 1, step: "Finish sections 1 and 2; submit checkpoint 1 by the end of the week"}
    - {week: 5, step: "Act on checkpoint 1's automated feedback"}
    - {week: 6, step: "Consolidation week: act on checkpoint 1's feedback and start the design; if behind, catch up here or across weeks 7 to 9"}
    - {week: 7, step: "Stability analysis of your first design; draft section 4"}
    - {week: 8, event: Checkpoint 2, step: "Robustness and the designed controller; sections 3 and 4; submit checkpoint 2, then peer review"}
    - {week: 9, event: Checkpoint 3, step: "Verification and the whole draft paper; submit checkpoint 3"}
    - {week: 10, step: "Act on checkpoint 3's feedback. Optional: a state-feedback design, for credit under criterion B2"}
    - {week: 11, event: Deadline, step: "Final checks with cade30008.validate_submission; submit by Thursday"}

laboratory:
  from_week: 1
  to_week: 6
  note: Open access and self-scheduled; consolidation week is the last week of the window

# The student workload model, settled 19 September and revised the same day for
# the consolidation week. Deliberately below the notional hours for this half of
# the unit: a planned, sustainable week matters more than the credit
# arithmetic, and the gap is recorded rather than hidden. Hours per week, by the
# kind of week (weeks.yaml).
workload:
  notional: 100          # hours: 10 of the unit's 20 credits
  by_kind:
    lecture:       {lecture: 2, independent: 2, coursework: 2}
    guest:         {lecture: 2, independent: 2, coursework: 2}
    consolidation: {consolidation: 4, coursework: 2}
  laboratory: 4          # in total, on top, self-scheduled in the laboratory window
  independent_parts:     # how a lecture week's 2 h of independent learning divide (P17)
    close_the_loop: 0.75
    examples: 1.0
    next_case: 0.25
